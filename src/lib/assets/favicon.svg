<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    
    <!-- Accent Gold-Orange Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb700" />
      <stop offset="50%" stop-color="#ff9000" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    
    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#ff9000" stroke-width="8" stroke-opacity="0.35" />

  <!-- Navigation Compass / Hub Graphic -->
  <g transform="translate(256, 256)">
    <!-- Outer Ring representing Globe/Network -->
    <circle r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-dasharray="30 15 5 15" stroke-opacity="0.9" filter="url(#glow)" />
    
    <!-- Subtle inner latitude/longitude curves -->
    <path d="M -140 0 A 140 65 0 0 0 140 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1" />
    <path d="M -140 0 A 140 65 0 0 1 140 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1" />
    <path d="M 0 -140 A 65 140 0 0 0 0 140" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1" />
    <path d="M 0 -140 A 65 140 0 0 1 0 140" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1" />

    <!-- Center Connection Node (Globe Core) -->
    <circle r="20" fill="#ffffff" filter="url(#glow)" />

    <!-- Sharp Navigation Pointer pointing Top-Right (Compass Arrow) -->
    <!-- Pointing from center to top right -->
    <path d="M -60,60 L -5,-5 L 90,-90 L 5,-5 L -60,60 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
    <!-- Secondary lighter facet for 3D look -->
    <path d="M -5,-5 L 90,-90 L 5,-5 Z" fill="#ffffff" fill-opacity="0.3" />
  </g>
</svg>